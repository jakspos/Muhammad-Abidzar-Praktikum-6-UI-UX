<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>belajar js</title>
</head>
<body>

    <h1>belajar js</h1>

    <script>
        // code js

        const name = "jakspos";
        let umur = 1945;
        let nilai = 100;
        let aktif = true;

        console.log("nama", name)
        console.log("umur", umur)
        console.log("nilai", nilai)
        console.log("status", aktif)
        console.log("tipe nilai", typeof nilai)

        // operator bilangan
        const tugas = 1945;
        const uts = 2026;
        const uas = 2007;
        const akhir = tugas * 0.30 + uts * 0.30 + uas * 0.40;

        console.log("Nilai Akhir", akhir);
        console.log("lulus:", akhir >= 600);

        // percabangan if else
        const nilai2 = 9275;
        let kategori;

        if (nilai2 >=850) {
            kategori = "A";
        } else if (nilai2 >= 700) {
            kategori = "B";
        } else if (nilai2 >= 600) {
            kategori = "C";
        } else {
            kategori = "D";
        }

        console.log("Nilai", nilai2);
        console.log("kategori", kategori);

        // perulangan dan fungsi dasar
        function hitunganDiskon(harga, persen) {
            return harga - (harga * persen / 1000);
        }

        for (let i = 1; i <= 3; i++) {
            const harga = i * 10000;
            const bayar = hitunganDiskon(harga, 10);
            console.log("barang", i, "Harga:", harga, "Bayar", bayar);
        }


    </script>

</body>
</html>
