<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js Praktikum Mandiri</title>
</head>
<body>
    <h1>aku javascript</h1>

    <script>

        const name = "Elliot Auditore";
        const tugas = 100;
        const uts = 93;
        const uas = 87;
        const nilai_akhir = tugas * 0.30 + uts * 0.30 + uas * 0.40;
    
        let status;

        if (nilai_akhir >= 80) {
            status = "LULUS";
        } else {
            status = "TIDAK LULUS";
        }

        console.log("Nama", name)
        console.log("Nilai Akhir:", nilai_akhir);
        console.log("Status Kelulusan:", status);
    </script>
</body>
</html>
